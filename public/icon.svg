<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F3832"/>
      <stop offset="100%" stop-color="#071E1A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd1df"/>
      <stop offset="100%" stop-color="#eeb9cc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#eeb9cc" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#eeb9cc" stroke-width="3" stroke-opacity="0.2"/>

  <!-- Partner Intertwined Heart + Pulse Wave -->
  <g transform="translate(256, 230)" filter="url(#glow)">
    <!-- Main Heart Base -->
    <path d="M 0,110 
             C -90,50 -170,-20 -170,-95 
             C -170,-165 -115,-205 -50,-205 
             C -18,-205 0,-185 0,-175 
             C 0,-185 18,-205 50,-205 
             C 115,-205 170,-165 170,-95 
             C 170,-20 90,50 0,110 Z" 
          fill="none" 
          stroke="url(#accentGrad)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Pulse / Activity Line through Center -->
    <path d="M -130,-40 L -60,-40 L -25,-105 L 15,35 L 50,-40 L 130,-40" 
          fill="none" 
          stroke="#4FD1C5" 
          stroke-width="20" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
          
    <!-- Sparkle Elements -->
    <circle cx="95" cy="-140" r="14" fill="#eeb9cc" />
    <circle cx="-95" cy="-140" r="10" fill="#4FD1C5" />
  </g>

  <!-- App Title Typography -->
  <text x="256" y="430" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="44" 
        font-weight="800" 
        letter-spacing="2" 
        fill="#ffffff" 
        text-anchor="middle">
    HABITHUB
  </text>
</svg>
